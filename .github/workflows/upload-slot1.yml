name: Upload Slot 1 - Channel 1 (8 PM PKT)

on:
  schedule:
    # 15:00 UTC = 20:00 PKT (Pakistan Standard Time = UTC+5)
    - cron: "0 15 * * *"
  # Allow manual trigger from GitHub UI for testing
  workflow_dispatch:
    inputs:
      channel:
        description: "Run only this channel ID (leave blank for channel_1)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        required: false
        default: "false"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/automation.db
          key: automation-db-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            automation-db-${{ github.sha }}-
            automation-db-

      - name: Restore credentials & tokens
        run: |
          mkdir -p credentials tokens
          # Each channel's credentials are stored as GitHub Secrets
          # Secret name format: CHANNEL_1_CLIENT_SECRET (base64-encoded JSON)
          # Token name format:  CHANNEL_1_TOKEN (base64-encoded JSON)
          # Add more channels here as you onboard them.
          if [ -n "${{ secrets.CHANNEL_1_CLIENT_SECRET }}" ]; then
            echo "${{ secrets.CHANNEL_1_CLIENT_SECRET }}" | base64 -d > credentials/channel_1_client_secret.json
          fi
          if [ -n "${{ secrets.CHANNEL_1_TOKEN }}" ]; then
            echo "${{ secrets.CHANNEL_1_TOKEN }}" | base64 -d > tokens/channel_1_token.json
          fi
          if [ -n "${{ secrets.CHANNEL_2_CLIENT_SECRET }}" ]; then
            echo "${{ secrets.CHANNEL_2_CLIENT_SECRET }}" | base64 -d > credentials/channel_2_client_secret.json
          fi
          if [ -n "${{ secrets.CHANNEL_2_TOKEN }}" ]; then
            echo "${{ secrets.CHANNEL_2_TOKEN }}" | base64 -d > tokens/channel_2_token.json
          fi

      - name: Write .env
        run: |
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          # Override dry_run from workflow_dispatch input
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          else
            echo "DRY_RUN=false" >> .env
          fi

      - name: Run Slot 1
        run: |
          # Default to channel_1 only; override with manual dispatch input if set
          CHANNEL_ARG="--channel channel_1"
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_ARG="--channel ${{ github.event.inputs.channel }}"
          fi
          python run.py --slot 1 $CHANNEL_ARG

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/automation.db
          key: automation-db-${{ github.run_id }}

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot1-${{ github.run_id }}
          path: logs/
          retention-days: 14
