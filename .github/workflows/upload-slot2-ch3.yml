name: Upload Slot 2 - Channel 3 (3 PM PKT)

on:
  # Allow manual trigger from GitHub UI for testing
  workflow_dispatch:
    inputs:
      channel:
        description: "Run only this channel ID (leave blank for channel_3)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        required: false
        default: "false"

concurrency:
  group: upload-channel_3
  cancel-in-progress: false

env:
  DB_PAGE_ID: channel_3

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached ffmpeg (downloaded once, reused every run)
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ~/.ffmpeg-bin
          key: ffmpeg-static-v1

      - name: Install ffmpeg
        run: |
          set +e
          # Owner 2026-11-19: ffmpeg is downloaded ONCE and kept in the GitHub cache; every later
          # run copies it in seconds. A slow apt mirror can no longer stall a run.
          mkdir -p ~/.ffmpeg-bin
          if [ ! -x ~/.ffmpeg-bin/ffmpeg ] || ! ~/.ffmpeg-bin/ffmpeg -version >/dev/null 2>&1; then
            echo "ffmpeg not cached yet - downloading the static build once"
            for url in "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
                       "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"; do
              for attempt in 1 2 3; do
                if curl -fsSL --connect-timeout 20 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz; then
                  rm -rf /tmp/ffmpeg-static && mkdir -p /tmp/ffmpeg-static
                  if tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components 1 2>/dev/null; then
                    BIN=$(find /tmp/ffmpeg-static -name ffmpeg -type f | head -1)
                    PROBE=$(find /tmp/ffmpeg-static -name ffprobe -type f | head -1)
                    [ -n "$BIN" ] && cp "$BIN" ~/.ffmpeg-bin/ffmpeg && [ -n "$PROBE" ] && cp "$PROBE" ~/.ffmpeg-bin/ffprobe
                    chmod +x ~/.ffmpeg-bin/* 2>/dev/null
                    ~/.ffmpeg-bin/ffmpeg -version >/dev/null 2>&1 && break 2
                  fi
                fi
                sleep 5
              done
            done
          else
            echo "ffmpeg restored from cache"
          fi
          if ~/.ffmpeg-bin/ffmpeg -version >/dev/null 2>&1; then
            sudo cp ~/.ffmpeg-bin/ffmpeg ~/.ffmpeg-bin/ffprobe /usr/local/bin/
          else
            echo "static ffmpeg unavailable - last resort apt (capped at 5 min)"
            timeout 300 sudo apt-get install -y --no-install-recommends --fix-missing ffmpeg 2>/dev/null
          fi
          if ffmpeg -version >/dev/null 2>&1; then ffmpeg -version | head -1; ffprobe -version | head -1
          else echo "::warning::ffmpeg not available -- longform/dual conversion will be skipped this run"; fi
          exit 0

      - name: Restore cached fonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-notosansjp-v1

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: data/channel_3.db
          key: automation-db-channel_3-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            automation-db-channel_3-${{ github.sha }}-
      - name: Install Claude Code CLI (owner's Claude subscription, 2026-11-19)
        # The API key has no credit; the AI title/thumbnail/merge pick now use the owner's
        # $20 subscription via secret CLAUDE_CODE_OAUTH_TOKEN. Never fails the job.
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version || echo "claude cli not installed"

      - name: Restore credentials & tokens
        run: |
          mkdir -p credentials tokens
          if [ -n "${{ secrets.CHANNEL_3_CLIENT_SECRET }}" ]; then
            echo "${{ secrets.CHANNEL_3_CLIENT_SECRET }}" | base64 -d > credentials/channel_3_client_secret.json
          fi
          if [ -n "${{ secrets.CHANNEL_3_TOKEN }}" ]; then
            echo "${{ secrets.CHANNEL_3_TOKEN }}" | base64 -d > tokens/channel_3_token.json
          fi

      - name: Write .env
        run: |
          echo "LOG_LEVEL=INFO" >> .env
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          else
            echo "DRY_RUN=false" >> .env
          fi

      - name: Write TikTok cookies
        run: |
          if [ -n "${{ secrets.TIKTOK_COOKIES }}" ]; then
            echo "${{ secrets.TIKTOK_COOKIES }}" | base64 -d > /tmp/tiktok_cookies.txt
            echo "TIKTOK_COOKIES_FILE=/tmp/tiktok_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Run Slot 2 (merged 3 min+ long video)
        # Owner test 2026-11-12: ONE merged 3 min+ video a day (merge_upload.py) - same-topic
        # clips (new, or used 15+ days ago) joined in original 9:16, AI title/description/
        # thumbnail. If today's video is already up the run stops by itself.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          DB_PAGE_ID: channel_3
        run: |
          mkdir -p fonts
          [ -s fonts/NotoSansJP.ttf ] || curl -fsSL --retry 3 --max-time 120 -o fonts/NotoSansJP.ttf "https://github.com/google/fonts/raw/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf" || true
          python merge_upload.py --channel channel_3 --slot 2 ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: AI thumbnail for today's long video
        # Claude watches the video, Vertex (Gemini) draws the scene, we add the Japanese
        # text; then thumbnails.set. Never fails the upload job.
        if: always()
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          VERTEX_PROJECT: ${{ secrets.VERTEX_PROJECT }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          DB_PAGE_ID: channel_3
        run: |
          mkdir -p fonts
          [ -s fonts/NotoSansJP.ttf ] || curl -fsSL --retry 3 --max-time 120 -o fonts/NotoSansJP.ttf "https://github.com/google/fonts/raw/main/ofl/notosansjp/NotoSansJP%5Bwght%5D.ttf"
          python thumbnails.py --channel channel_3 --lang Japanese

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/channel_3.db
          key: automation-db-channel_3-${{ github.run_id }}

      - name: Checkpoint DB WAL
        if: always()
        run: |
          if [ -f data/channel_3.db ]; then
            python -c "import sqlite3; c=sqlite3.connect('data/channel_3.db'); r=c.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone(); print('WAL checkpoint:', r); c.close()"
          fi

      - name: Commit DB to repo
        if: always()
        run: |
          if [ ! -f data/channel_3.db ]; then
            echo "No DB file found — skipping commit"
            exit 0
          fi
          cp data/channel_3.db /tmp/channel_3_new.db
          git fetch origin main
          git restore data/channel_3.db 2>/dev/null || git checkout -- data/channel_3.db 2>/dev/null || true
          git checkout -B main origin/main
          cp /tmp/channel_3_new.db data/channel_3.db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/channel_3.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update channel_3.db [skip ci]"
            for i in 1 2 3; do
              git push origin main && break
              echo "Push failed (attempt $i/3) -- re-basing DB onto latest origin..."
              cp data/channel_3.db /tmp/channel_3_retry.db
              git fetch origin main
              git restore data/channel_3.db 2>/dev/null || git checkout -- data/channel_3.db 2>/dev/null || true
              git checkout -B main origin/main
              cp /tmp/channel_3_retry.db data/channel_3.db
              git add -f data/channel_3.db
              if git diff --staged --quiet; then
                echo "DB already up to date on origin -- nothing to push"
                break
              fi
              git commit -m "chore: update channel_3.db [skip ci]"
            done
          else
            echo "No DB changes to commit"
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot2-ch3-${{ github.run_id }}
          path: logs/
          retention-days: 14
