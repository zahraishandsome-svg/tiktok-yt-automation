name: Upload Slot 2 (1 AM PKT)

on:
  schedule:
    # 20:00 UTC = 01:00 PKT next day (Pakistan Standard Time = UTC+5)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Run only this channel ID (leave blank for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (no actual upload)"
        required: false
        default: "false"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore credentials & tokens
        run: |
          mkdir -p credentials tokens
          if [ -n "${{ secrets.CHANNEL_1_CLIENT_SECRET }}" ]; then
            echo "${{ secrets.CHANNEL_1_CLIENT_SECRET }}" | base64 -d > credentials/channel_1_client_secret.json
          fi
          if [ -n "${{ secrets.CHANNEL_1_TOKEN }}" ]; then
            echo "${{ secrets.CHANNEL_1_TOKEN }}" | base64 -d > tokens/channel_1_token.json
          fi

      - name: Write .env
        run: |
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> .env
          echo "LOG_LEVEL=INFO" >> .env
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "DRY_RUN=true" >> .env
          else
            echo "DRY_RUN=false" >> .env
          fi

      - name: Run Slot 2
        run: |
          CHANNEL_ARG=""
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            CHANNEL_ARG="--channel ${{ github.event.inputs.channel }}"
          fi
          python run.py --slot 2 $CHANNEL_ARG

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-slot2-${{ github.run_id }}
          path: logs/
          retention-days: 14
